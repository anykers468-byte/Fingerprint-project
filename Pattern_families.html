<script>
(() => {
  const root = document.getElementById("fingerprint-patterns");

  if (!root || root.dataset.ready) return;
  root.dataset.ready = "true";

  const buttons = root.querySelectorAll(".pattern-button");
  const image = root.querySelector("#fingerprint-image");
  const description = root.querySelector(".pattern-description");
  const percentage = root.querySelector("#pattern-percentage");
  const definition = root.querySelector("#pattern-definition");

  const NS = "http://www.w3.org/2000/svg";

  const patterns = {
    loop: {
      percentage: "≈ 60–65%",
      definition:
        "Ridges enter from one side, curve around, and exit the same side. A typical loop has one delta.",
      label: "Loop fingerprint pattern",
      paths: (() => {
        const result = [];

        for (let i = 0; i < 11; i++) {
          const left = 48 + i * 4.1;
          const right = 172 - i * 4.1;
          const top = 28 + i * 5.2;
          const bottom = 187 - i * 1.3;

          result.push(
            `M ${left} ${bottom}
             C ${left - 9} ${top + 55},
               ${left + 10} ${top},
               110 ${top}
             C ${right - 10} ${top},
               ${right + 9} ${top + 55},
               ${right} ${bottom}`
          );
        }

        return result;
      })()
    },

    whorl: {
      percentage: "≈ 30–35%",
      definition:
        "Ridges form circular or spiral patterns around a central area. A typical whorl has two deltas.",
      label: "Whorl fingerprint pattern",
      paths: (() => {
        const result = [];

        for (let i = 0; i < 11; i++) {
          const rx = 83 - i * 5.2;
          const ry = 83 - i * 5.2;

          result.push(
            `M 110 ${110 - ry}
             A ${rx} ${ry} 0 1 1 109.9 ${110 - ry}`
          );
        }

        result.push(
          "M 110 110 C 142 82 151 128 119 142 C 89 155 72 119 91 92 C 107 70 139 83 145 107"
        );

        return result;
      })()
    },

    arch: {
      percentage: "≈ 5%",
      definition:
        "Ridges enter from one side, rise in the middle, and flow out on the opposite side. An arch has no delta.",
      label: "Arch fingerprint pattern",
      paths: (() => {
        const result = [];

        for (let i = 0; i < 11; i++) {
          const y = 75 + i * 7;
          const rise = 43 - i * 1.5;

          result.push(
            `M 27 ${y + 35}
             C 56 ${y + 20},
               75 ${y - rise},
               110 ${y - rise}
             C 145 ${y - rise},
               164 ${y + 20},
               193 ${y + 35}`
          );
        }

        return result;
      })()
    }
  };

  function drawPattern(name) {
    const pattern = patterns[name];

    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 220 220");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", pattern.label);

    pattern.paths.forEach((pathData, index) => {
      const path = document.createElementNS(NS, "path");

      path.setAttribute("d", pathData);
      path.setAttribute("class", "ridge");
      path.style.animationDelay = `${index * 0.075}s`;

      svg.appendChild(path);
    });

    image.replaceChildren(svg);
  }

  let currentPattern = "loop";
  let changeNumber = 0;

  drawPattern("loop");

  function selectPattern(name) {
    if (!patterns[name] || name === currentPattern) return;

    currentPattern = name;
    const thisChange = ++changeNumber;

    buttons.forEach(button => {
      const selected = button.dataset.pattern === name;

      button.classList.toggle("active", selected);
      button.setAttribute("aria-pressed", String(selected));
    });

    description.classList.add("fading");

    window.setTimeout(() => {
      if (thisChange !== changeNumber) return;

      const selected = patterns[name];

      percentage.textContent = selected.percentage;
      definition.textContent = selected.definition;

      drawPattern(name);

      description.classList.remove("fading");
    }, 250);
  }

  buttons.forEach(button => {
    button.addEventListener("click", () => {
      selectPattern(button.dataset.pattern);
    });
  });
})();
</script>
